name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Duel dependencies
        run: npm ci
        working-directory: duel

      - name: Build Duel
        run: npm run build
        working-directory: duel

      - name: Copy Duel build into site output
        run: |
          mkdir -p build/duel/play
          cp -r duel/dist/. build/duel/play/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true
          cname: ben.kallaus.me
