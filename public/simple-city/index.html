<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dev City</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1326; }
  #stage { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  // ---- Isometric configuration ----
  const TILE_W = 64;
  const TILE_H = 32;
  const GRID = 16;

  let DPR = 1;
  const VIEW = { scale: 1, ox: 0, oy: 0 };

  // Ground tile types: 0 = grass, 1 = pavement
  const ground = [];
  for (let y = 0; y < GRID; y++) {
    const row = [];
    for (let x = 0; x < GRID; x++) {
      const path = (x === 5 || x === 10 || y === 6 || y === 11);
      row.push(path ? 1 : 0);
    }
    ground.push(row);
  }

  // ---- Building layout (roughly mirrors the target: shops + towers) ----
  // gx,gy = back corner tile; w,h = footprint in tiles; hgt = pixels tall
  const buildings = [
    // Left cluster (cafes / shops)
    { gx: 0.4, gy: 0.4, w: 2, h: 2.4, hgt: 250, wall: "#3b4d78", name: "KUBER-CUTIE",  neon: "#6ee7f0" },
    { gx: 0.4, gy: 3.2, w: 2, h: 1.8, hgt: 120, wall: "#3d4a63", name: "CLOUDY CAT",   neon: "#7fd0ff" },
    { gx: 0.4, gy: 5.4, w: 2, h: 1.8, hgt: 96,  wall: "#3a4257", name: "BEANSTACK",    neon: "#8bd66b" },
    { gx: 2.9, gy: 3.4, w: 2, h: 2,   hgt: 150, wall: "#39415a", name: "DOCKER'S DEN", neon: "#7fb2ff" },
    { gx: 2.9, gy: 6.2, w: 2, h: 1.8, hgt: 90,  wall: "#3b4258", name: "REACT-A-LOT",  neon: "#5ad6f0" },

    // Center towers
    { gx: 6.2, gy: 0.5, w: 1.6, h: 1.6, hgt: 300, wall: "#2f3550", name: "CODE WARS",  neon: "#7ad0ff" },
    { gx: 8.0, gy: 0.7, w: 1.6, h: 1.6, hgt: 260, wall: "#333a55", name: "TS TOWERS",  neon: "#67d3f2" },
    { gx: 6.4, gy: 3.2, w: 2.2, h: 1.8, hgt: 150, wall: "#3a4570", name: "LAMBDA LABS", neon: "#8fd6ff" },
    { gx: 8.8, gy: 3.2, w: 1.6, h: 1.8, hgt: 150, wall: "#3a4570", name: "SERVERLESS",  neon: "#a9b6ff" },

    // Right cluster
    { gx: 11.6, gy: 0.6, w: 2, h: 2, hgt: 230, wall: "#39344f", name: "DATA-DOGGO",  neon: "#ffb469" },
    { gx: 12.2, gy: 6.4, w: 1.8, h: 1.6, hgt: 110, wall: "#3a4258", name: "BLUEPRINT",  neon: "#8fd0ff" },
    { gx: 11.1, gy: 9.0, w: 1.6, h: 1.4, hgt: 104, wall: "#3c4a5a", name: "STYLISH",   neon: "#ff7fa8" },
    { gx: 13.9, gy: 8.0, w: 1.8, h: 1.6, hgt: 96,  wall: "#4a3a52", name: "ARCH-PUPS",  neon: "#ff86e0" },
    { gx: 13.6, gy: 10.0, w: 2, h: 1.8, hgt: 120, wall: "#43384f", name: "CODE WORKS",  neon: "#ffab5e" },
  ];

  // ---- Coordinate helpers ----
  // Pure isometric coordinates (world space); the world transform in
  // frame() positions and scales everything to fit the viewport.
  function isoToScreen(gx, gy) {
    return { x: (gx - gy) * (TILE_W / 2), y: (gx + gy) * (TILE_H / 2) };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * DPR);
    canvas.height = Math.floor(window.innerHeight * DPR);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    const w = window.innerWidth, h = window.innerHeight;
    // Auto-fit: keep the whole city on screen across sizes / iframe embeds.
    VIEW.scale = Math.max(0.42, Math.min(w / 1240, h / 830, 1.2));
    VIEW.ox = w / 2 - GRID * (TILE_W / 2) * VIEW.scale * 0.02;
    VIEW.oy = h * 0.30;
  }

  // ---- Tile drawing ----
  function drawTileDiamond(sx, sy, topColor) {
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + TILE_W / 2, sy + TILE_H / 2);
    ctx.lineTo(sx, sy + TILE_H);
    ctx.lineTo(sx - TILE_W / 2, sy + TILE_H / 2);
    ctx.closePath();
    ctx.fillStyle = topColor;
    ctx.fill();
  }
  const grassColor = (x, y) => ((x + y) % 2 === 0) ? "#2f6d3a" : "#2a6234";
  const paveColor  = (x, y) => ((x + y) % 2 === 0) ? "#565f75" : "#4e576d";

  function drawGround() {
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        const s = isoToScreen(x, y);
        drawTileDiamond(s.x, s.y, ground[y][x] === 1 ? paveColor(x, y) : grassColor(x, y));
      }
    }
  }

  // Paved lots / sidewalks under each building block.
  function drawLots() {
    for (const b of buildings) {
      const pad = 0.55;
      const p1 = isoToScreen(b.gx - pad, b.gy - pad);
      const p2 = isoToScreen(b.gx + b.w + pad, b.gy - pad);
      const p3 = isoToScreen(b.gx + b.w + pad, b.gy + b.h + pad);
      const p4 = isoToScreen(b.gx - pad, b.gy + b.h + pad);
      poly([p1, p2, p3, p4], "#525a70");
      // curb highlight
      ctx.strokeStyle = "#5f6884"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath();
      ctx.stroke();
    }
  }

  // ---- Cross street (car road along gy at fixed gx) ----
  const ROADV = { gx: 5.2, gyMin: -1.0, gyMax: 12.4, hw: 0.34 };

  function drawRoads() {
    const { gx, gyMin, gyMax, hw } = ROADV;
    // asphalt
    poly([isoToScreen(gx - hw, gyMin), isoToScreen(gx + hw, gyMin),
          isoToScreen(gx + hw, gyMax), isoToScreen(gx - hw, gyMax)], "#3a4053");
    // dashed centre line
    for (let gy = gyMin; gy < gyMax; gy += 0.8) {
      railLine(gx, gy + 0.12, gx, gy + 0.5, "#caa94e", 1.6);
    }
    // zebra crossing over the cross street at the y=6 plaza
    for (let g = -0.28; g <= 0.28; g += 0.14) {
      railLine(gx + g, 5.7, gx + g, 6.6, "#e8ecf4", 2.4);
    }
    // zebra crossing over the tram street
    for (let g = 4.7; g <= 5.7; g += 0.16) {
      railLine(g, 11.95, g, 12.85, "#e8ecf4", 2.6);
    }
  }

  // Soft contact shadows under each building.
  function drawShadows() {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    for (const b of buildings) {
      const pad = 0.18;
      const p1 = isoToScreen(b.gx - pad, b.gy - pad);
      const p2 = isoToScreen(b.gx + b.w + pad, b.gy - pad);
      const p3 = isoToScreen(b.gx + b.w + pad, b.gy + b.h + pad);
      const p4 = isoToScreen(b.gx - pad, b.gy + b.h + pad);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- Starfield ----
  const stars = [];
  (function seedStars() {
    for (let i = 0; i < 90; i++) {
      stars.push({ x: Math.random(), y: Math.random() * 0.5, r: Math.random() * 1.3 + 0.3, ph: Math.random() * 6.3 });
    }
  })();
  function drawStars() {
    const W = window.innerWidth, H = window.innerHeight;
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(nowMs * 0.002 + s.ph);
      ctx.globalAlpha = 0.25 + tw * 0.6;
      ctx.fillStyle = "#dfe8ff";
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    const W = window.innerWidth, H = window.innerHeight;
    const g = ctx.createRadialGradient(W / 2, H * 0.52, H * 0.25, W / 2, H * 0.52, H * 0.9);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(4,7,18,0.55)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Color utilities ----
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r * f)));
    g = Math.max(0, Math.min(255, Math.round(g * f)));
    b = Math.max(0, Math.min(255, Math.round(b * f)));
    return `rgb(${r},${g},${b})`;
  }

  // Fill a face parallelogram, then run a callback in its local unit space.
  function faceSpace(O, U, V, drawLocal) {
    ctx.save();
    ctx.transform(U.x, U.y, V.x, V.y, O.x, O.y);
    drawLocal();
    ctx.restore();
  }

  function drawWindows(cols, rows, litColor) {
    // In unit space: u across (0..1), v up (0..1)
    const mx = 0.12, my = 0.06;             // margins
    const cw = (1 - mx * 2) / cols;
    const ch = (1 - my * 2) / rows;
    const pad = 0.18;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const seed = c * 7 + r * 13;
        const lit = (seed % 5) !== 0;   // most windows lit
        if (lit) {
          // occasional slow flicker on a subset of windows
          const flick = (seed % 4 === 0) ? (0.72 + 0.28 * Math.sin(nowMs * 0.003 + seed)) : 1;
          ctx.globalAlpha = flick;
          ctx.fillStyle = litColor;
        } else {
          ctx.globalAlpha = 1;
          ctx.fillStyle = "rgba(20,26,45,0.9)";
        }
        const x = mx + c * cw + cw * pad;
        const y = my + r * ch + ch * pad;
        ctx.fillRect(x, y, cw * (1 - pad * 2), ch * (1 - pad * 2));
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawBuilding(b) {
    const H = b.hgt;
    const baseBack  = isoToScreen(b.gx, b.gy);
    const baseEast  = isoToScreen(b.gx + b.w, b.gy);
    const baseSouth = isoToScreen(b.gx + b.w, b.gy + b.h);
    const baseWest  = isoToScreen(b.gx, b.gy + b.h);
    const up = (p) => ({ x: p.x, y: p.y - H });
    const topBack = up(baseBack), topEast = up(baseEast), topSouth = up(baseSouth), topWest = up(baseWest);

    // Left face (west <-> south)
    ctx.beginPath();
    ctx.moveTo(baseWest.x, baseWest.y);
    ctx.lineTo(baseSouth.x, baseSouth.y);
    ctx.lineTo(topSouth.x, topSouth.y);
    ctx.lineTo(topWest.x, topWest.y);
    ctx.closePath();
    ctx.fillStyle = shade(b.wall, 0.72);
    ctx.fill();

    // Right face (south <-> east)
    ctx.beginPath();
    ctx.moveTo(baseSouth.x, baseSouth.y);
    ctx.lineTo(baseEast.x, baseEast.y);
    ctx.lineTo(topEast.x, topEast.y);
    ctx.lineTo(topSouth.x, topSouth.y);
    ctx.closePath();
    ctx.fillStyle = shade(b.wall, 0.92);
    ctx.fill();

    // Windows on both faces
    const rows = Math.max(2, Math.round(H / 34));
    const litL = "rgba(255,214,140,0.85)";
    const litR = "rgba(255,224,160,0.95)";
    faceSpace(
      { x: baseWest.x, y: baseWest.y },
      { x: baseSouth.x - baseWest.x, y: baseSouth.y - baseWest.y },
      { x: topWest.x - baseWest.x, y: topWest.y - baseWest.y },
      () => drawWindows(Math.max(2, Math.round(b.h * 2)), rows, litL)
    );
    faceSpace(
      { x: baseSouth.x, y: baseSouth.y },
      { x: baseEast.x - baseSouth.x, y: baseEast.y - baseSouth.y },
      { x: topSouth.x - baseSouth.x, y: topSouth.y - baseSouth.y },
      () => drawWindows(Math.max(2, Math.round(b.w * 2)), rows, litR)
    );

    // Storefront band + awning on the two front walls
    const isShop = b.hgt <= 135;
    faceSpace(
      { x: baseWest.x, y: baseWest.y },
      { x: baseSouth.x - baseWest.x, y: baseSouth.y - baseWest.y },
      { x: topWest.x - baseWest.x, y: topWest.y - baseWest.y },
      () => drawStorefront(b, Math.max(2, Math.round(b.h * 2)), isShop, rows)
    );
    faceSpace(
      { x: baseSouth.x, y: baseSouth.y },
      { x: baseEast.x - baseSouth.x, y: baseEast.y - baseSouth.y },
      { x: topSouth.x - baseSouth.x, y: topSouth.y - baseSouth.y },
      () => drawStorefront(b, Math.max(2, Math.round(b.w * 2)), isShop, rows)
    );

    // Top (roof)
    ctx.beginPath();
    ctx.moveTo(topBack.x, topBack.y);
    ctx.lineTo(topEast.x, topEast.y);
    ctx.lineTo(topSouth.x, topSouth.y);
    ctx.lineTo(topWest.x, topWest.y);
    ctx.closePath();
    ctx.fillStyle = shade(b.wall, 1.15);
    ctx.fill();

    drawRoofProps(b);
  }

  // A small solid iso box (no windows) — used for rooftop equipment.
  function drawSolidBox(gx, gy, fx, fy, h, lift, color) {
    const bb = isoLift(gx, gy, lift), be = isoLift(gx + fx, gy, lift);
    const bs = isoLift(gx + fx, gy + fy, lift), bw = isoLift(gx, gy + fy, lift);
    const up = (p) => ({ x: p.x, y: p.y - h });
    poly([bw, bs, up(bs), up(bw)], shade(color, 0.75));
    poly([bs, be, up(be), up(bs)], shade(color, 0.95));
    poly([up(bb), up(be), up(bs), up(bw)], shade(color, 1.2));
  }

  function drawAntenna(gx, gy, lift, h) {
    const base = isoLift(gx, gy, lift), tip = { x: base.x, y: base.y - h };
    ctx.strokeStyle = "#8894ad"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    const blink = 0.5 + 0.5 * Math.sin(nowMs * 0.006 + gx * 3);
    ctx.save();
    ctx.globalAlpha = 0.4 + blink * 0.6;
    ctx.fillStyle = "#ff5a5a"; ctx.shadowColor = "#ff5a5a"; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawRoofProps(b) {
    const L = b.hgt;
    drawSolidBox(b.gx + 0.28, b.gy + 0.28, 0.4, 0.4, 9, L, "#4a5268");
    drawSolidBox(b.gx + b.w - 0.68, b.gy + 0.5, 0.34, 0.5, 7, L, "#414a60");
    if (b.hgt > 140) drawSolidBox(b.gx + b.w * 0.5 - 0.2, b.gy + b.h - 0.7, 0.42, 0.42, 15, L, "#39415a");
    if (b.hgt > 205) drawAntenna(b.gx + b.w * 0.5, b.gy + 0.4, L, 28);
  }

  // Lit shopfront glow + striped awning near the bottom of a front wall
  // (drawn in the wall's unit space: u across 0..1, v up 0..1).
  function drawStorefront(b, cols, isShop, rows) {
    const bandTop = 1 / rows;          // one storey tall
    // warm lit ground floor
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(255,196,120,0.55)";
    ctx.fillRect(0.1, 0.03, 0.8, bandTop * 0.62);
    // dark doorway
    ctx.fillStyle = "rgba(30,22,16,0.7)";
    ctx.fillRect(0.44, 0.03, 0.12, bandTop * 0.5);
    if (!isShop) return;
    // striped awning just above the shopfront
    const ay = bandTop * 0.72, ah = bandTop * 0.42;
    const stripes = Math.max(4, cols * 2);
    const sw = 0.8 / stripes;
    for (let i = 0; i < stripes; i++) {
      ctx.fillStyle = (i % 2 === 0) ? b.neon : "#f2f4f8";
      ctx.globalAlpha = 0.92;
      ctx.fillRect(0.1 + i * sw, ay, sw + 0.002, ah);
    }
    ctx.globalAlpha = 1;
  }

  // Front-face geometry used to anchor a building's sign.
  function signGeom(b) {
    return {
      topSouth: { x: isoToScreen(b.gx + b.w, b.gy + b.h).x, y: isoToScreen(b.gx + b.w, b.gy + b.h).y - b.hgt },
      baseSouth: isoToScreen(b.gx + b.w, b.gy + b.h),
    };
  }

  function drawAllSigns() {
    const sorted = [...buildings].sort((a, b) => (a.gx + a.gy + a.w + a.h) - (b.gx + b.gy + b.w + b.h));
    for (const b of sorted) {
      const g = signGeom(b);
      drawSign(b, g.topSouth, g.baseSouth);
    }
  }

  // Billboarded neon sign anchored near the front-top of a building.
  function drawSign(b, topSouth, baseSouth) {
    if (!b.name) return;
    // Anchor a little below the roofline on the front face.
    const t = 0.14;
    const cx = topSouth.x + (baseSouth.x - topSouth.x) * t;
    const cy = topSouth.y + (baseSouth.y - topSouth.y) * t;

    const fs = Math.max(11, Math.min(15, b.w * 8));
    ctx.font = `700 ${fs}px "Trebuchet MS", "Segoe UI", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const tw = ctx.measureText(b.name).width;
    const padX = 8, padY = 5;
    const bw = tw + padX * 2, bh = fs + padY * 2;

    // Dark plaque
    ctx.save();
    ctx.fillStyle = "rgba(12,16,30,0.82)";
    roundRect(cx - bw / 2, cy - bh / 2, bw, bh, 4);
    ctx.fill();

    // Neon border + text glow (gently pulsing)
    const pulse = 10 + Math.sin(nowMs * 0.004 + cx * 0.05) * 4;
    ctx.shadowColor = b.neon;
    ctx.shadowBlur = pulse + 2;
    ctx.strokeStyle = b.neon;
    ctx.lineWidth = 1.4;
    roundRect(cx - bw / 2, cy - bh / 2, bw, bh, 4);
    ctx.stroke();

    ctx.shadowBlur = pulse;
    ctx.fillStyle = b.neon;
    ctx.fillText(b.name, cx, cy + 0.5);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- Rails + tram (foreground street, runs along gx at fixed gy) ----
  const TRAM = { gy: 12.4, gxMin: -1.5, gxMax: 16.5, gx: 2.0, dir: 1, speed: 0.030 };

  function railLine(gxA, gyA, gxB, gyB, color, width) {
    const a = isoToScreen(gxA, gyA), b = isoToScreen(gxB, gyB);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function drawRails() {
    // Foreground street corridor along gy=TRAM.gy — asphalt strip, two rails + ties.
    const gy = TRAM.gy;
    // asphalt band
    poly([
      isoToScreen(TRAM.gxMin, gy - 0.5), isoToScreen(TRAM.gxMax, gy - 0.5),
      isoToScreen(TRAM.gxMax, gy + 0.5), isoToScreen(TRAM.gxMin, gy + 0.5),
    ], "#3a4053");
    railLine(TRAM.gxMin, gy - 0.22, TRAM.gxMax, gy - 0.22, "#5a6478", 2.5);
    railLine(TRAM.gxMin, gy + 0.22, TRAM.gxMax, gy + 0.22, "#5a6478", 2.5);
    for (let gx = TRAM.gxMin; gx <= TRAM.gxMax; gx += 0.5) {
      railLine(gx, gy - 0.3, gx, gy + 0.3, "#2c3346", 2);
    }
  }

  // A rounded, lit vehicle. fx/fy = footprint extent (tiles) along gx/gy.
  function drawVehicle(v) {
    const fx = v.fx, fy = v.fy, H = v.hgt, lift = v.lift || 0;
    const g0 = { gx: v.gx - fx / 2, gy: v.gy - fy / 2 };
    const baseBack  = isoLift(g0.gx,       g0.gy,       lift);
    const baseEast  = isoLift(g0.gx + fx,  g0.gy,       lift);
    const baseSouth = isoLift(g0.gx + fx,  g0.gy + fy,  lift);
    const baseWest  = isoLift(g0.gx,       g0.gy + fy,  lift);
    const up = (p) => ({ x: p.x, y: p.y - H });
    const tBack = up(baseBack), tEast = up(baseEast), tSouth = up(baseSouth), tWest = up(baseWest);

    // left face
    poly([baseWest, baseSouth, tSouth, tWest], shade(v.body, 0.78));
    // right face
    poly([baseSouth, baseEast, tEast, tSouth], shade(v.body, 0.95));
    // roof
    poly([tBack, tEast, tSouth, tWest], shade(v.body, 1.18));

    // window strips (bright)
    faceSpace(
      { x: baseWest.x, y: baseWest.y },
      { x: baseSouth.x - baseWest.x, y: baseSouth.y - baseWest.y },
      { x: tWest.x - baseWest.x, y: tWest.y - baseWest.y },
      () => { ctx.fillStyle = "rgba(180,230,255,0.9)"; ctx.fillRect(0.06, 0.35, 0.88, 0.4); }
    );
    faceSpace(
      { x: baseSouth.x, y: baseSouth.y },
      { x: baseEast.x - baseSouth.x, y: baseEast.y - baseSouth.y },
      { x: tSouth.x - baseSouth.x, y: tSouth.y - baseSouth.y },
      () => { ctx.fillStyle = "rgba(180,230,255,0.9)"; ctx.fillRect(0.1, 0.35, 0.8, 0.4); }
    );
  }

  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function updateTram(dt) {
    TRAM.gx += TRAM.dir * TRAM.speed * dt;
    if (TRAM.gx < TRAM.gxMin) { TRAM.gx = TRAM.gxMin; TRAM.dir = 1; }
    if (TRAM.gx > TRAM.gxMax) { TRAM.gx = TRAM.gxMax; TRAM.dir = -1; }
  }

  // ---- Elevated monorail (right side, runs along gy at fixed gx) ----
  const MONO = { gx: 15.3, gyMin: -1.5, gyMax: 10.5, E: 92, gy: 1.0, dir: 1, speed: 0.020 };

  function isoLift(gx, gy, lift) {
    const s = isoToScreen(gx, gy);
    return { x: s.x, y: s.y - lift };
  }

  function drawMonorail() {
    const { gx, gyMin, gyMax, E } = MONO;
    const th = 12;   // beam thickness
    const hw = 0.16; // beam half-width in tiles

    // Support pillars
    for (let gy = gyMin + 0.5; gy <= gyMax; gy += 1.6) {
      const bl = isoToScreen(gx - 0.09, gy), br = isoToScreen(gx + 0.09, gy);
      const tl = isoLift(gx - 0.09, gy, E - th), tr = isoLift(gx + 0.09, gy, E - th);
      poly([bl, br, tr, tl], "#2b3247");
      // cap
      poly([isoLift(gx - 0.14, gy, E - th), isoLift(gx + 0.14, gy, E - th),
            isoLift(gx + 0.14, gy, E - th - 4), isoLift(gx - 0.14, gy, E - th - 4)], "#39415c");
    }

    // Beam side (right) + top
    poly([
      isoLift(gx + hw, gyMin, E - th), isoLift(gx + hw, gyMax, E - th),
      isoLift(gx + hw, gyMax, E),      isoLift(gx + hw, gyMin, E),
    ], "#333b54");
    poly([
      isoLift(gx - hw, gyMin, E - th), isoLift(gx + hw, gyMin, E - th),
      isoLift(gx + hw, gyMax, E - th), isoLift(gx - hw, gyMax, E - th),
    ], "#454f70");

    // The train, sitting on the beam
    drawVehicle({ gx, gy: MONO.gy, fx: 0.55, fy: 3.0, hgt: 30, lift: E - th, body: "#dfe6f2" });
  }

  function updateMono(dt) {
    MONO.gy += MONO.dir * MONO.speed * dt;
    if (MONO.gy < MONO.gyMin + 0.5) { MONO.gy = MONO.gyMin + 0.5; MONO.dir = 1; }
    if (MONO.gy > MONO.gyMax - 2.5) { MONO.gy = MONO.gyMax - 2.5; MONO.dir = -1; }
  }

  // ---- Scenery props ----
  const trees = [
    [1.3, 13.4], [3.1, 14.6], [5.0, 13.2], [8.4, 14.4], [10.2, 13.0],
    [12.6, 13.6], [14.4, 12.4], [1.0, 9.2], [0.8, 6.0], [6.6, 8.6],
    [15.2, 6.8], [11.0, 11.0], [4.2, 10.6],
  ];
  const ponds = [ [2.4, 14.6, 1.4], [9.6, 13.8, 1.2] ];
  const lamps = [ [3.0, 11.7], [7.5, 11.7], [11.5, 11.7], [0.5, 11.7], [14.0, 11.7] ];
  const benches = [ [4.0, 12.0], [8.6, 12.0], [12.0, 12.0] ];

  function drawPond(gx, gy, r) {
    const c = isoToScreen(gx, gy);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(1, 0.5);
    ctx.beginPath();
    ctx.arc(0, 0, r * TILE_W * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = "#2f6f9e";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-r * 4, -r * 4, r * TILE_W * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = "#4f93c4";
    ctx.fill();
    ctx.restore();
  }

  function drawPonds() { for (const p of ponds) drawPond(p[0], p[1], p[2]); }

  function drawTree(gx, gy, s = 1) {
    const b = isoToScreen(gx, gy);
    // trunk
    ctx.fillStyle = "#5a3f2b";
    ctx.fillRect(b.x - 2 * s, b.y - 16 * s, 4 * s, 16 * s);
    // foliage (three stacked blobs for volume)
    const blob = (dx, dy, r, col) => {
      ctx.beginPath();
      ctx.arc(b.x + dx, b.y - 22 * s + dy, r * s, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
    };
    blob(0, 6, 12, "#20502c");
    blob(-6, 0, 9, "#286237");
    blob(6, 1, 9, "#2c6b3c");
    blob(0, -5, 10, "#347a45");
  }

  function drawLamp(gx, gy) {
    const b = isoToScreen(gx, gy);
    // light pool on ground
    const grd = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, 34);
    grd.addColorStop(0, "rgba(255,224,150,0.28)");
    grd.addColorStop(1, "rgba(255,224,150,0)");
    ctx.fillStyle = grd;
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1, 0.5);
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // post
    ctx.strokeStyle = "#39415a"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y - 34); ctx.lineTo(b.x + 7, b.y - 36); ctx.stroke();
    // glowing head
    ctx.save();
    ctx.shadowColor = "#ffe08a"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#ffe6a0";
    ctx.beginPath(); ctx.arc(b.x + 8, b.y - 35, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBench(gx, gy) {
    const b = isoToScreen(gx, gy);
    ctx.fillStyle = "#5b6273";
    ctx.fillRect(b.x - 9, b.y - 6, 18, 4);
    ctx.fillStyle = "#474d5c";
    ctx.fillRect(b.x - 9, b.y - 2, 18, 2);
  }

  // ---- People (animated pedestrians) ----
  const skinTones = ["#e6b98f", "#c98d63", "#8d5a3b", "#f0cba6"];
  const shirtCols = ["#e05a5a", "#4f8de0", "#e0a84f", "#5fbf7a", "#b06fd0", "#e0e0e0", "#57c4c4"];
  function rand(a, b) { return a + Math.random() * (b - a); }

  const people = [];
  (function seedPeople() {
    // Short back-and-forth routes on plazas / sidewalks (avoid footprints).
    const routes = [
      [5.2, 8, 5.2, 12], [10, 7, 10, 12], [6, 6.2, 12, 6.2],
      [1, 6.2, 4.5, 6.2], [5.4, 4, 5.4, 6.5], [7, 12.9, 12, 12.9],
      [2, 12.9, 4.5, 12.9], [10, 9, 10, 5], [11, 6.2, 15, 6.2],
      [12.5, 7.5, 12.5, 11],
    ];
    for (let i = 0; i < 22; i++) {
      const r = routes[i % routes.length];
      people.push({
        ax: r[0], ay: r[1], bx: r[2], by: r[3],
        t: Math.random(), dir: Math.random() < 0.5 ? 1 : -1,
        spd: rand(0.15, 0.32) / 1000,
        shirt: shirtCols[(Math.random() * shirtCols.length) | 0],
        skin: skinTones[(Math.random() * skinTones.length) | 0],
        ph: Math.random() * Math.PI * 2,
      });
    }
  })();

  function updatePeople(dt) {
    for (const p of people) {
      p.t += p.dir * p.spd * dt;
      if (p.t > 1) { p.t = 1; p.dir = -1; }
      if (p.t < 0) { p.t = 0; p.dir = 1; }
    }
  }

  function personPos(p) {
    return { gx: p.ax + (p.bx - p.ax) * p.t, gy: p.ay + (p.by - p.ay) * p.t };
  }

  function drawPerson(p, tmsec) {
    const g = personPos(p);
    const s = isoToScreen(g.gx, g.gy);
    const bob = Math.abs(Math.sin(tmsecPhase(p, tmsec))) * 1.6;
    // shadow
    ctx.save(); ctx.translate(s.x, s.y); ctx.scale(1, 0.5);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // body
    ctx.fillStyle = p.shirt;
    ctx.beginPath();
    ctx.roundRect(s.x - 2.4, s.y - 11 - bob, 4.8, 9, 2);
    ctx.fill();
    // head
    ctx.fillStyle = p.skin;
    ctx.beginPath();
    ctx.arc(s.x, s.y - 13 - bob, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  function tmsecPhase(p, tmsec) { return p.ph + tmsec * 0.008; }

  // ---- Floating emoji speech bubbles ----
  const bubbles = [
    [4.6, 7.4, "😊", 64],   // 😊 near the cafes
    [8.2, 6.6, "🍕", 78],  // 🍕 plaza dining
    [11.8, 5.2, "👥", 150], // 👥 crowd top-right
    [2.2, 5.6, "☕", 96],         // ☕ coffee, left cafes
    [12.6, 9.4, "💬", 60],  // 💬 chat, right shops
    [6.6, 9.2, "❤️", 40],   // ❤ plaza
  ];

  function drawBubble(gx, gy, emoji, lift) {
    const anchor = isoLift(gx, gy, lift);
    const bob = Math.sin(nowMs * 0.002 + gx) * 2.2;
    const cx = anchor.x, cy = anchor.y + bob;
    const w = 30, h = 26, r = 9;

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#f6f8fc";
    roundRect(cx - w / 2, cy - h, w, h, r);
    ctx.fill();
    // tail
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 2);
    ctx.lineTo(cx + 5, cy - 2);
    ctx.lineTo(cx, cy + 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.font = '15px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, cx, cy - h / 2 + 1);
  }

  function drawBubbles() {
    for (const b of bubbles) drawBubble(b[0], b[1], b[2], b[3]);
  }

  // ---- Unified depth-sorted scene ----
  function drawScene() {
    const items = [];
    for (const b of buildings) items.push({ z: b.gx + b.gy + b.w + b.h, draw: () => drawBuilding(b) });
    for (const t of trees)   items.push({ z: t[0] + t[1], draw: () => drawTree(t[0], t[1]) });
    for (const l of lamps)   items.push({ z: l[0] + l[1] - 0.01, draw: () => drawLamp(l[0], l[1]) });
    for (const bn of benches) items.push({ z: bn[0] + bn[1] - 0.02, draw: () => drawBench(bn[0], bn[1]) });
    for (const p of people)  { const g = personPos(p); items.push({ z: g.gx + g.gy + 0.05, draw: () => drawPerson(p, nowMs) }); }
    items.push({
      z: TRAM.gx + TRAM.gy + 0.9,
      draw: () => drawVehicle({ gx: TRAM.gx, gy: TRAM.gy, fx: 2.6, fy: 0.7, hgt: 26, body: "#c9d2e0" }),
    });
    items.sort((a, b) => a.z - b.z);
    for (const it of items) it.draw();
  }

  let last = performance.now();
  let nowMs = last;
  function frame(now) {
    nowMs = now;
    const dt = Math.min(50, now - last); last = now;
    updateTram(dt);
    updateMono(dt);
    updatePeople(dt);

    const W = window.innerWidth, H = window.innerHeight;
    // Screen-space backdrop
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a1024");
    g.addColorStop(1, "#141d3a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    drawStars();

    // World-space scene (auto-fitted)
    ctx.setTransform(DPR * VIEW.scale, 0, 0, DPR * VIEW.scale, DPR * VIEW.ox, DPR * VIEW.oy);
    drawGround();
    drawLots();
    drawRoads();
    drawPonds();
    drawShadows();
    drawRails();
    drawScene();
    drawMonorail();
    drawAllSigns();
    drawBubbles();

    // Screen-space overlay
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawVignette();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
