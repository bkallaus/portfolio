<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meepleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
:root{
  --night:#141a36; --ink:#1b1426; --board:#f4e6c4; --board-edge:#c9a46c; --accent:#c8443f; --muted:#6d5a48;
  --f-display:"Pixelify Sans","Silkscreen",ui-monospace,monospace;
  --f-ui:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-ui)}
#sky{position:fixed;inset:0;background:linear-gradient(#5aa0e0,#cfe9f7)}
#stars{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;pointer-events:none}
#view{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none;cursor:grab}
#view.dragging{cursor:grabbing}
.board{position:fixed;background:var(--board);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--board-edge),4px 4px 0 rgba(20,14,30,.55);padding:8px 10px;pointer-events:none}
#sign{top:calc(12px + env(safe-area-inset-top,0px));left:12px}
#sign h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em;line-height:1}
#clock{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 12px;margin-top:8px;font-size:11px;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:4px}
.stat canvas{width:16px;height:16px;image-rendering:pixelated}
#log{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;max-width:min(380px,calc(100vw - 48px));font-size:10px;line-height:1.55;letter-spacing:.02em}
#log h2{font-family:var(--f-display);font-size:12px;margin:0 0 4px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
#log p{margin:0}
#log p .d{color:var(--accent)}
#ctl{display:flex;gap:4px;margin-top:8px;pointer-events:auto}
#ctl button{font:inherit;font-size:10px;line-height:1;padding:4px 6px;min-width:26px;background:#fff8e6;color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(20,14,30,.45);cursor:pointer}
#ctl button:hover{background:#ffe9b8}
#ctl button[aria-pressed="true"]{background:var(--ink);color:var(--board);box-shadow:none;transform:translate(2px,2px)}
#ctl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){#sign h1{font-size:18px}#stats{font-size:10px;gap:3px 8px}#log{font-size:9px}}
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="stars"></canvas>
<canvas id="view"></canvas>
<div class="board" id="sign"><h1>Meepleton</h1><div id="clock">Day 1 · 06:00</div><div id="stats"></div><div id="ctl" role="group" aria-label="Simulation speed"><button type="button" data-speed="0" aria-label="Pause" title="Pause (Space)">II</button><button type="button" data-speed="1" title="Normal speed (1)">1x</button><button type="button" data-speed="2" title="Double speed (2)">2x</button><button type="button" data-speed="4" title="Fast (3)">4x</button></div></div>
<div class="board" id="log"><h2>Town chronicle</h2><div id="logList"></div></div>
