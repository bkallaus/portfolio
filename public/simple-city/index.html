<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dev City</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1326; }
  #stage { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  // ---- Isometric configuration ----
  const TILE_W = 64;
  const TILE_H = 32;
  const GRID = 16;

  let DPR = 1;
  const VIEW = { scale: 1, ox: 0, oy: 0 };

  // Ground tile types: 0 = grass, 1 = pavement
  const ground = [];
  for (let y = 0; y < GRID; y++) {
    const row = [];
    for (let x = 0; x < GRID; x++) {
      const path = (x === 5 || x === 10 || y === 6 || y === 11);
      row.push(path ? 1 : 0);
    }
    ground.push(row);
  }

  // ---- Building layout (roughly mirrors the target: shops + towers) ----
  // gx,gy = back corner tile; w,h = footprint in tiles; hgt = pixels tall
  const buildings = [
    // Left cluster (cafes / shops)
    { gx: 0.4, gy: 0.4, w: 2, h: 2.4, hgt: 250, wall: "#3b4d78", name: "KUBER-CUTIE",  icon: "📦",  neon: "#6ee7f0" },
    { gx: 0.4, gy: 3.2, w: 2, h: 1.8, hgt: 120, wall: "#3d4a63", name: "CLOUDY CAT",   icon: "☁️",   neon: "#7fd0ff" },
    { gx: 0.4, gy: 5.4, w: 2, h: 1.8, hgt: 96,  wall: "#3a4257", name: "BEANSTACK",    icon: "🌱",    neon: "#8bd66b" },
    { gx: 2.9, gy: 3.4, w: 2, h: 2,   hgt: 150, wall: "#39415a", name: "DOCKER'S DEN", icon: "🐳", neon: "#7fb2ff" },
    { gx: 2.9, gy: 6.2, w: 2, h: 1.8, hgt: 90,  wall: "#3b4258", name: "REACT-A-LOT",  icon: "⚛️",  neon: "#5ad6f0" },

    // Center towers
    { gx: 6.2, gy: 0.5, w: 1.6, h: 1.6, hgt: 300, wall: "#2f3550", name: "CODE WARS",  icon: "⚔️",  neon: "#7ad0ff" },
    { gx: 8.0, gy: 0.7, w: 1.6, h: 1.6, hgt: 260, wall: "#333a55", name: "TS TOWERS",  icon: "🔷",  neon: "#67d3f2" },
    { gx: 6.4, gy: 3.2, w: 2.2, h: 1.8, hgt: 150, wall: "#3a4570", name: "LAMBDA LABS", icon: "🧪", neon: "#8fd6ff" },
    { gx: 8.8, gy: 3.2, w: 1.6, h: 1.8, hgt: 150, wall: "#3a4570", name: "SERVERLESS",  icon: "🐑",  neon: "#a9b6ff" },

    // Right cluster
    { gx: 11.6, gy: 0.6, w: 2, h: 2, hgt: 230, wall: "#39344f", name: "DATA-DOGGO",  icon: "🐶",  neon: "#ffb469" },
    { gx: 12.2, gy: 6.4, w: 1.8, h: 1.6, hgt: 110, wall: "#3a4258", name: "BLUEPRINT",  icon: "📐",  neon: "#8fd0ff" },
    { gx: 11.1, gy: 9.0, w: 1.6, h: 1.4, hgt: 104, wall: "#3c4a5a", name: "STYLISH",   icon: "🎨",   neon: "#ff7fa8" },
    { gx: 13.9, gy: 8.0, w: 1.8, h: 1.6, hgt: 96,  wall: "#4a3a52", name: "ARCH-PUPS",  icon: "🐾",  neon: "#ff86e0" },
    { gx: 13.6, gy: 10.0, w: 2, h: 1.8, hgt: 120, wall: "#43384f", name: "CODE WORKS",  icon: "🛠️",  neon: "#ffab5e" },
  ];

  // ---- Coordinate helpers ----
  // Pure isometric coordinates (world space); the world transform in
  // frame() positions and scales everything to fit the viewport.
  function isoToScreen(gx, gy) {
    return { x: (gx - gy) * (TILE_W / 2), y: (gx + gy) * (TILE_H / 2) };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * DPR);
    canvas.height = Math.floor(window.innerHeight * DPR);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    const w = window.innerWidth, h = window.innerHeight;
    // Auto-fit: keep the whole city on screen across sizes / iframe embeds.
    VIEW.scale = Math.max(0.42, Math.min(w / 1240, h / 830, 1.2));
    VIEW.ox = w / 2 - GRID * (TILE_W / 2) * VIEW.scale * 0.02;
    VIEW.oy = h * 0.30;
  }

  // ---- Tile drawing ----
  function drawTileDiamond(sx, sy, topColor) {
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + TILE_W / 2, sy + TILE_H / 2);
    ctx.lineTo(sx, sy + TILE_H);
    ctx.lineTo(sx - TILE_W / 2, sy + TILE_H / 2);
    ctx.closePath();
    ctx.fillStyle = topColor;
    ctx.fill();
  }
  const grassColor = (x, y) => ((x + y) % 2 === 0) ? "#2f6d3a" : "#2a6234";
  const paveColor  = (x, y) => ((x + y) % 2 === 0) ? "#565f75" : "#4e576d";

  function drawGround() {
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        const s = isoToScreen(x, y);
        drawTileDiamond(s.x, s.y, ground[y][x] === 1 ? paveColor(x, y) : grassColor(x, y));
      }
    }
  }

  // Paved lots / sidewalks under each building block.
  function drawLots() {
    for (const b of buildings) {
      const pad = 0.55;
      const p1 = isoToScreen(b.gx - pad, b.gy - pad);
      const p2 = isoToScreen(b.gx + b.w + pad, b.gy - pad);
      const p3 = isoToScreen(b.gx + b.w + pad, b.gy + b.h + pad);
      const p4 = isoToScreen(b.gx - pad, b.gy + b.h + pad);
      poly([p1, p2, p3, p4], "#525a70");
      // curb highlight
      ctx.strokeStyle = "#5f6884"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath();
      ctx.stroke();
    }
  }

  // ---- Cross street (car road along gy at fixed gx) ----
  const ROADV = { gx: 5.2, gyMin: -1.0, gyMax: 12.4, hw: 0.34 };

  function drawRoads() {
    const { gx, gyMin, gyMax, hw } = ROADV;
    // asphalt
    poly([isoToScreen(gx - hw, gyMin), isoToScreen(gx + hw, gyMin),
          isoToScreen(gx + hw, gyMax), isoToScreen(gx - hw, gyMax)], "#3a4053");
    // dashed centre line
    for (let gy = gyMin; gy < gyMax; gy += 0.8) {
      railLine(gx, gy + 0.12, gx, gy + 0.5, "#caa94e", 1.6);
    }
    // zebra crossing over the cross street at the y=6 plaza
    for (let g = -0.28; g <= 0.28; g += 0.14) {
      railLine(gx + g, 5.7, gx + g, 6.6, "#e8ecf4", 2.4);
    }
    // zebra crossing over the tram street
    for (let g = 4.7; g <= 5.7; g += 0.16) {
      railLine(g, 11.95, g, 12.85, "#e8ecf4", 2.6);
    }
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Neon glow pooling on the pavement in front of each storefront.
  function drawGlowPools() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const b of buildings) {
      const c = isoToScreen(b.gx + b.w / 2, b.gy + b.h + 0.35);
      const [r, g, bl] = hexToRgb(b.neon);
      const R = Math.max(26, b.w * 26);
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, 0.5);
      const grd = ctx.createRadialGradient(0, 0, 2, 0, 0, R);
      grd.addColorStop(0, `rgba(${r},${g},${bl},0.20)`);
      grd.addColorStop(1, `rgba(${r},${g},${bl},0)`);
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // Soft contact shadows under each building.
  function drawShadows() {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    for (const b of buildings) {
      const pad = 0.18;
      const p1 = isoToScreen(b.gx - pad, b.gy - pad);
      const p2 = isoToScreen(b.gx + b.w + pad, b.gy - pad);
      const p3 = isoToScreen(b.gx + b.w + pad, b.gy + b.h + pad);
      const p4 = isoToScreen(b.gx - pad, b.gy + b.h + pad);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- Starfield ----
  const stars = [];
  (function seedStars() {
    for (let i = 0; i < 90; i++) {
      stars.push({ x: Math.random(), y: Math.random() * 0.5, r: Math.random() * 1.3 + 0.3, ph: Math.random() * 6.3 });
    }
  })();
  function drawStars() {
    const W = window.innerWidth, H = window.innerHeight;
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(nowMs * 0.002 + s.ph);
      ctx.globalAlpha = 0.25 + tw * 0.6;
      ctx.fillStyle = "#dfe8ff";
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMoon() {
    const W = window.innerWidth, H = window.innerHeight;
    const mx = W * 0.82, my = H * 0.17, r = 26;
    const halo = ctx.createRadialGradient(mx, my, r * 0.5, mx, my, r * 3);
    halo.addColorStop(0, "rgba(226,235,255,0.35)");
    halo.addColorStop(1, "rgba(226,235,255,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, r * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#eef2ff";
    ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(190,200,225,0.5)";
    for (const cr of [[-8, -6, 5], [7, 4, 4], [2, -10, 3]]) {
      ctx.beginPath(); ctx.arc(mx + cr[0], my + cr[1], cr[2], 0, Math.PI * 2); ctx.fill();
    }
  }

  const clouds = [
    { x: 0.15, y: 0.12, s: 1.0, spd: 0.0000018 },
    { x: 0.55, y: 0.08, s: 0.7, spd: 0.0000026 },
    { x: 0.78, y: 0.26, s: 0.85, spd: 0.0000015 },
    { x: 0.35, y: 0.30, s: 0.6, spd: 0.0000032 },
  ];
  function drawClouds() {
    const W = window.innerWidth, H = window.innerHeight;
    ctx.save();
    ctx.fillStyle = "rgba(150,165,205,0.10)";
    for (const c of clouds) {
      const px = (((c.x + nowMs * c.spd) % 1.2) - 0.1) * W;
      const py = c.y * H, s = c.s;
      for (const o of [[-34, 0, 26], [-8, -8, 30], [22, -2, 24], [46, 4, 20]]) {
        ctx.beginPath();
        ctx.ellipse(px + o[0] * s, py + o[1] * s, o[2] * s, o[2] * s * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // Birds drifting across the sky (screen space)
  const birds = [];
  (function seedBirds() {
    for (let i = 0; i < 6; i++) birds.push({ x: Math.random(), y: 0.1 + Math.random() * 0.28, spd: rand(0.02, 0.05) / 1000, ph: Math.random() * 6.3, s: rand(0.7, 1.2) });
  })();
  function drawBirds() {
    const W = window.innerWidth, H = window.innerHeight;
    ctx.strokeStyle = "rgba(210,220,240,0.55)"; ctx.lineWidth = 1.3;
    for (const b of birds) {
      const px = ((b.x + nowMs * b.spd) % 1.1) * W, py = b.y * H;
      const flap = Math.sin(nowMs * 0.008 + b.ph) * 3 * b.s;
      ctx.beginPath();
      ctx.moveTo(px - 5 * b.s, py + flap);
      ctx.lineTo(px, py - 2 * b.s);
      ctx.lineTo(px + 5 * b.s, py + flap);
      ctx.stroke();
    }
  }

  function drawVignette() {
    const W = window.innerWidth, H = window.innerHeight;
    const g = ctx.createRadialGradient(W / 2, H * 0.52, H * 0.25, W / 2, H * 0.52, H * 0.9);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(4,7,18,0.55)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Color utilities ----
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r * f)));
    g = Math.max(0, Math.min(255, Math.round(g * f)));
    b = Math.max(0, Math.min(255, Math.round(b * f)));
    return `rgb(${r},${g},${b})`;
  }

  // Fill a face parallelogram, then run a callback in its local unit space.
  function faceSpace(O, U, V, drawLocal) {
    ctx.save();
    ctx.transform(U.x, U.y, V.x, V.y, O.x, O.y);
    drawLocal();
    ctx.restore();
  }

  function drawWindows(cols, rows, litColor) {
    // In unit space: u across (0..1), v up (0..1)
    const mx = 0.12, my = 0.06;             // margins
    const cw = (1 - mx * 2) / cols;
    const ch = (1 - my * 2) / rows;
    const pad = 0.18;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const seed = c * 7 + r * 13;
        const lit = (seed % 5) !== 0;   // most windows lit
        if (lit) {
          // occasional slow flicker on a subset of windows
          const flick = (seed % 4 === 0) ? (0.72 + 0.28 * Math.sin(nowMs * 0.003 + seed)) : 1;
          ctx.globalAlpha = flick;
          ctx.fillStyle = litColor;
        } else {
          ctx.globalAlpha = 1;
          ctx.fillStyle = "rgba(20,26,45,0.9)";
        }
        const x = mx + c * cw + cw * pad;
        const y = my + r * ch + ch * pad;
        ctx.fillRect(x, y, cw * (1 - pad * 2), ch * (1 - pad * 2));
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawBuilding(b) {
    const H = b.hgt;
    const baseBack  = isoToScreen(b.gx, b.gy);
    const baseEast  = isoToScreen(b.gx + b.w, b.gy);
    const baseSouth = isoToScreen(b.gx + b.w, b.gy + b.h);
    const baseWest  = isoToScreen(b.gx, b.gy + b.h);
    const up = (p) => ({ x: p.x, y: p.y - H });
    const topBack = up(baseBack), topEast = up(baseEast), topSouth = up(baseSouth), topWest = up(baseWest);

    // Left face (west <-> south)
    ctx.beginPath();
    ctx.moveTo(baseWest.x, baseWest.y);
    ctx.lineTo(baseSouth.x, baseSouth.y);
    ctx.lineTo(topSouth.x, topSouth.y);
    ctx.lineTo(topWest.x, topWest.y);
    ctx.closePath();
    ctx.fillStyle = shade(b.wall, 0.72);
    ctx.fill();

    // Right face (south <-> east)
    ctx.beginPath();
    ctx.moveTo(baseSouth.x, baseSouth.y);
    ctx.lineTo(baseEast.x, baseEast.y);
    ctx.lineTo(topEast.x, topEast.y);
    ctx.lineTo(topSouth.x, topSouth.y);
    ctx.closePath();
    ctx.fillStyle = shade(b.wall, 0.92);
    ctx.fill();

    // Windows on both faces
    const rows = Math.max(2, Math.round(H / 34));
    const litL = "rgba(255,214,140,0.85)";
    const litR = "rgba(255,224,160,0.95)";
    faceSpace(
      { x: baseWest.x, y: baseWest.y },
      { x: baseSouth.x - baseWest.x, y: baseSouth.y - baseWest.y },
      { x: topWest.x - baseWest.x, y: topWest.y - baseWest.y },
      () => drawWindows(Math.max(2, Math.round(b.h * 2)), rows, litL)
    );
    faceSpace(
      { x: baseSouth.x, y: baseSouth.y },
      { x: baseEast.x - baseSouth.x, y: baseEast.y - baseSouth.y },
      { x: topSouth.x - baseSouth.x, y: topSouth.y - baseSouth.y },
      () => drawWindows(Math.max(2, Math.round(b.w * 2)), rows, litR)
    );

    // Storefront band + awning on the two front walls
    const isShop = b.hgt <= 135;
    faceSpace(
      { x: baseWest.x, y: baseWest.y },
      { x: baseSouth.x - baseWest.x, y: baseSouth.y - baseWest.y },
      { x: topWest.x - baseWest.x, y: topWest.y - baseWest.y },
      () => drawStorefront(b, Math.max(2, Math.round(b.h * 2)), isShop, rows)
    );
    faceSpace(
      { x: baseSouth.x, y: baseSouth.y },
      { x: baseEast.x - baseSouth.x, y: baseEast.y - baseSouth.y },
      { x: topSouth.x - baseSouth.x, y: topSouth.y - baseSouth.y },
      () => drawStorefront(b, Math.max(2, Math.round(b.w * 2)), isShop, rows)
    );

    // Top (roof)
    ctx.beginPath();
    ctx.moveTo(topBack.x, topBack.y);
    ctx.lineTo(topEast.x, topEast.y);
    ctx.lineTo(topSouth.x, topSouth.y);
    ctx.lineTo(topWest.x, topWest.y);
    ctx.closePath();
    ctx.fillStyle = shade(b.wall, 1.15);
    ctx.fill();

    // atmospheric depth haze — buildings further back fade into the night
    const haze = Math.max(0, Math.min(0.24, (8 - (b.gx + b.gy)) / 8 * 0.24));
    if (haze > 0.01) {
      const hz = `rgba(26,34,64,${haze})`;
      poly([baseWest, baseSouth, topSouth, topWest], hz);
      poly([baseSouth, baseEast, topEast, topSouth], hz);
      poly([topBack, topEast, topSouth, topWest], hz);
    }

    drawRoofProps(b);
  }

  // A small solid iso box (no windows) — used for rooftop equipment.
  function drawSolidBox(gx, gy, fx, fy, h, lift, color) {
    const bb = isoLift(gx, gy, lift), be = isoLift(gx + fx, gy, lift);
    const bs = isoLift(gx + fx, gy + fy, lift), bw = isoLift(gx, gy + fy, lift);
    const up = (p) => ({ x: p.x, y: p.y - h });
    poly([bw, bs, up(bs), up(bw)], shade(color, 0.75));
    poly([bs, be, up(be), up(bs)], shade(color, 0.95));
    poly([up(bb), up(be), up(bs), up(bw)], shade(color, 1.2));
  }

  function drawAntenna(gx, gy, lift, h) {
    const base = isoLift(gx, gy, lift), tip = { x: base.x, y: base.y - h };
    ctx.strokeStyle = "#8894ad"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    const blink = 0.5 + 0.5 * Math.sin(nowMs * 0.006 + gx * 3);
    ctx.save();
    ctx.globalAlpha = 0.4 + blink * 0.6;
    ctx.fillStyle = "#ff5a5a"; ctx.shadowColor = "#ff5a5a"; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawRoofProps(b) {
    const L = b.hgt;
    drawSolidBox(b.gx + 0.28, b.gy + 0.28, 0.4, 0.4, 9, L, "#4a5268");
    drawSolidBox(b.gx + b.w - 0.68, b.gy + 0.5, 0.34, 0.5, 7, L, "#414a60");
    if (b.hgt > 140) drawSolidBox(b.gx + b.w * 0.5 - 0.2, b.gy + b.h - 0.7, 0.42, 0.42, 15, L, "#39415a");
    if (b.hgt > 205) drawAntenna(b.gx + b.w * 0.5, b.gy + 0.4, L, 28);
  }

  // Lit shopfront glow + striped awning near the bottom of a front wall
  // (drawn in the wall's unit space: u across 0..1, v up 0..1).
  function drawStorefront(b, cols, isShop, rows) {
    const bandTop = 1 / rows;          // one storey tall
    // warm lit ground floor
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(255,196,120,0.55)";
    ctx.fillRect(0.1, 0.03, 0.8, bandTop * 0.62);
    // dark doorway
    ctx.fillStyle = "rgba(30,22,16,0.7)";
    ctx.fillRect(0.44, 0.03, 0.12, bandTop * 0.5);
    if (!isShop) return;
    // striped awning just above the shopfront
    const ay = bandTop * 0.72, ah = bandTop * 0.42;
    const stripes = Math.max(4, cols * 2);
    const sw = 0.8 / stripes;
    for (let i = 0; i < stripes; i++) {
      ctx.fillStyle = (i % 2 === 0) ? b.neon : "#f2f4f8";
      ctx.globalAlpha = 0.92;
      ctx.fillRect(0.1 + i * sw, ay, sw + 0.002, ah);
    }
    ctx.globalAlpha = 1;
  }

  // Front-face geometry used to anchor a building's sign.
  function signGeom(b) {
    return {
      topSouth: { x: isoToScreen(b.gx + b.w, b.gy + b.h).x, y: isoToScreen(b.gx + b.w, b.gy + b.h).y - b.hgt },
      baseSouth: isoToScreen(b.gx + b.w, b.gy + b.h),
    };
  }

  function drawAllSigns() {
    const sorted = [...buildings].sort((a, b) => (a.gx + a.gy + a.w + a.h) - (b.gx + b.gy + b.w + b.h));
    for (const b of sorted) {
      const g = signGeom(b);
      drawSign(b, g.topSouth, g.baseSouth);
    }
  }

  // Billboarded neon sign anchored near the front-top of a building.
  function drawSign(b, topSouth, baseSouth) {
    if (!b.name) return;
    // Anchor a little below the roofline on the front face.
    const t = 0.14;
    const cx = topSouth.x + (baseSouth.x - topSouth.x) * t;
    const cy = topSouth.y + (baseSouth.y - topSouth.y) * t;

    const fs = Math.max(11, Math.min(15, b.w * 8));
    const nameFont = `700 ${fs}px "Trebuchet MS", "Segoe UI", sans-serif`;
    const emojiFont = `${fs}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textBaseline = "middle";
    ctx.font = nameFont;
    const tw = ctx.measureText(b.name).width;
    const icon = b.icon || "";
    const iconW = icon ? fs + 4 : 0;
    const padX = 8, padY = 5, gap = icon ? 4 : 0;
    const contentW = iconW + gap + tw;
    const bw = contentW + padX * 2, bh = fs + padY * 2;
    const left = cx - bw / 2;

    // Dark plaque
    ctx.save();
    ctx.fillStyle = "rgba(12,16,30,0.82)";
    roundRect(left, cy - bh / 2, bw, bh, 4);
    ctx.fill();

    // Neon border (gently pulsing)
    const pulse = 10 + Math.sin(nowMs * 0.004 + cx * 0.05) * 4;
    ctx.shadowColor = b.neon;
    ctx.shadowBlur = pulse + 2;
    ctx.strokeStyle = b.neon;
    ctx.lineWidth = 1.4;
    roundRect(left, cy - bh / 2, bw, bh, 4);
    ctx.stroke();

    // Icon
    ctx.textAlign = "left";
    if (icon) {
      ctx.shadowBlur = 0;
      ctx.font = emojiFont;
      ctx.fillStyle = "#fff";
      ctx.fillText(icon, left + padX, cy + 0.5);
    }
    // Name (glowing neon)
    ctx.shadowBlur = pulse;
    ctx.font = nameFont;
    ctx.fillStyle = b.neon;
    ctx.fillText(b.name, left + padX + iconW + gap, cy + 0.5);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- Rails + tram (foreground street, runs along gx at fixed gy) ----
  const TRAM = { gy: 12.4, gxMin: -1.5, gxMax: 16.5, gx: 2.0, dir: 1, speed: 0.030 };

  function railLine(gxA, gyA, gxB, gyB, color, width) {
    const a = isoToScreen(gxA, gyA), b = isoToScreen(gxB, gyB);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function drawRails() {
    // Foreground street corridor along gy=TRAM.gy — asphalt strip, two rails + ties.
    const gy = TRAM.gy;
    // asphalt band
    poly([
      isoToScreen(TRAM.gxMin, gy - 0.5), isoToScreen(TRAM.gxMax, gy - 0.5),
      isoToScreen(TRAM.gxMax, gy + 0.5), isoToScreen(TRAM.gxMin, gy + 0.5),
    ], "#3a4053");
    railLine(TRAM.gxMin, gy - 0.22, TRAM.gxMax, gy - 0.22, "#5a6478", 2.5);
    railLine(TRAM.gxMin, gy + 0.22, TRAM.gxMax, gy + 0.22, "#5a6478", 2.5);
    for (let gx = TRAM.gxMin; gx <= TRAM.gxMax; gx += 0.5) {
      railLine(gx, gy - 0.3, gx, gy + 0.3, "#2c3346", 2);
    }
  }

  // A rounded, lit vehicle. fx/fy = footprint extent (tiles) along gx/gy.
  function drawVehicle(v) {
    const fx = v.fx, fy = v.fy, H = v.hgt, lift = v.lift || 0;
    const g0 = { gx: v.gx - fx / 2, gy: v.gy - fy / 2 };
    const baseBack  = isoLift(g0.gx,       g0.gy,       lift);
    const baseEast  = isoLift(g0.gx + fx,  g0.gy,       lift);
    const baseSouth = isoLift(g0.gx + fx,  g0.gy + fy,  lift);
    const baseWest  = isoLift(g0.gx,       g0.gy + fy,  lift);
    const up = (p) => ({ x: p.x, y: p.y - H });
    const tBack = up(baseBack), tEast = up(baseEast), tSouth = up(baseSouth), tWest = up(baseWest);

    // left face
    poly([baseWest, baseSouth, tSouth, tWest], shade(v.body, 0.78));
    // right face
    poly([baseSouth, baseEast, tEast, tSouth], shade(v.body, 0.95));
    // roof
    poly([tBack, tEast, tSouth, tWest], shade(v.body, 1.18));

    // window strips (bright)
    faceSpace(
      { x: baseWest.x, y: baseWest.y },
      { x: baseSouth.x - baseWest.x, y: baseSouth.y - baseWest.y },
      { x: tWest.x - baseWest.x, y: tWest.y - baseWest.y },
      () => { ctx.fillStyle = "rgba(180,230,255,0.9)"; ctx.fillRect(0.06, 0.35, 0.88, 0.4); }
    );
    faceSpace(
      { x: baseSouth.x, y: baseSouth.y },
      { x: baseEast.x - baseSouth.x, y: baseEast.y - baseSouth.y },
      { x: tSouth.x - baseSouth.x, y: tSouth.y - baseSouth.y },
      () => { ctx.fillStyle = "rgba(180,230,255,0.9)"; ctx.fillRect(0.1, 0.35, 0.8, 0.4); }
    );
  }

  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function updateTram(dt) {
    TRAM.gx += TRAM.dir * TRAM.speed * dt;
    if (TRAM.gx < TRAM.gxMin) { TRAM.gx = TRAM.gxMin; TRAM.dir = 1; }
    if (TRAM.gx > TRAM.gxMax) { TRAM.gx = TRAM.gxMax; TRAM.dir = -1; }
  }

  // ---- Elevated monorail (right side, runs along gy at fixed gx) ----
  const MONO = { gx: 15.3, gyMin: -1.5, gyMax: 10.5, E: 92, gy: 1.0, dir: 1, speed: 0.020 };

  function isoLift(gx, gy, lift) {
    const s = isoToScreen(gx, gy);
    return { x: s.x, y: s.y - lift };
  }

  function drawMonorail() {
    const { gx, gyMin, gyMax, E } = MONO;
    const th = 12;   // beam thickness
    const hw = 0.16; // beam half-width in tiles

    // Support pillars
    for (let gy = gyMin + 0.5; gy <= gyMax; gy += 1.6) {
      const bl = isoToScreen(gx - 0.09, gy), br = isoToScreen(gx + 0.09, gy);
      const tl = isoLift(gx - 0.09, gy, E - th), tr = isoLift(gx + 0.09, gy, E - th);
      poly([bl, br, tr, tl], "#2b3247");
      // cap
      poly([isoLift(gx - 0.14, gy, E - th), isoLift(gx + 0.14, gy, E - th),
            isoLift(gx + 0.14, gy, E - th - 4), isoLift(gx - 0.14, gy, E - th - 4)], "#39415c");
    }

    // Beam side (right) + top
    poly([
      isoLift(gx + hw, gyMin, E - th), isoLift(gx + hw, gyMax, E - th),
      isoLift(gx + hw, gyMax, E),      isoLift(gx + hw, gyMin, E),
    ], "#333b54");
    poly([
      isoLift(gx - hw, gyMin, E - th), isoLift(gx + hw, gyMin, E - th),
      isoLift(gx + hw, gyMax, E - th), isoLift(gx - hw, gyMax, E - th),
    ], "#454f70");

    // The train, sitting on the beam
    drawVehicle({ gx, gy: MONO.gy, fx: 0.55, fy: 3.0, hgt: 30, lift: E - th, body: "#dfe6f2" });
  }

  // ---- Delivery drone (flies a slow loop above the city) ----
  const DRONE = { cx: 8, cy: 5, rx: 6.5, ry: 4.5, ang: 0, spd: 0.0004, lift: 155 };
  function updateDrone(dt) { DRONE.ang += DRONE.spd * dt; }
  function drawDrone() {
    const gx = DRONE.cx + Math.cos(DRONE.ang) * DRONE.rx;
    const gy = DRONE.cy + Math.sin(DRONE.ang) * DRONE.ry;
    const lift = DRONE.lift + Math.sin(nowMs * 0.003) * 6;
    const g = isoToScreen(gx, gy);
    const p = { x: g.x, y: g.y - lift };
    // ground shadow
    ctx.save(); ctx.translate(g.x, g.y); ctx.scale(1, 0.5);
    ctx.fillStyle = "rgba(0,0,0,0.16)";
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // arms + rotor blur
    ctx.strokeStyle = "#39415a"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(p.x - 8, p.y - 3); ctx.lineTo(p.x + 8, p.y - 3); ctx.stroke();
    ctx.fillStyle = "rgba(180,200,235,0.35)";
    for (const dx of [-8, 8]) { ctx.beginPath(); ctx.ellipse(p.x + dx, p.y - 4, 5, 1.6, 0, 0, Math.PI * 2); ctx.fill(); }
    // body
    ctx.fillStyle = "#4a5268";
    ctx.beginPath(); ctx.roundRect(p.x - 5, p.y - 3, 10, 5, 2); ctx.fill();
    // package
    ctx.fillStyle = "#b98a4f";
    ctx.fillRect(p.x - 2.5, p.y + 2, 5, 4);
    // blinking light
    const blink = 0.5 + 0.5 * Math.sin(nowMs * 0.01);
    ctx.save(); ctx.globalAlpha = 0.4 + blink * 0.6;
    ctx.fillStyle = "#5fe0a0"; ctx.shadowColor = "#5fe0a0"; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.arc(p.x, p.y + 7, 1.6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  function updateMono(dt) {
    MONO.gy += MONO.dir * MONO.speed * dt;
    if (MONO.gy < MONO.gyMin + 0.5) { MONO.gy = MONO.gyMin + 0.5; MONO.dir = 1; }
    if (MONO.gy > MONO.gyMax - 2.5) { MONO.gy = MONO.gyMax - 2.5; MONO.dir = -1; }
  }

  // ---- Scenery props ----
  const trees = [
    [1.3, 13.4], [3.1, 14.6], [5.0, 13.2], [8.4, 14.4], [10.2, 13.0],
    [12.6, 13.6], [14.4, 12.4], [1.0, 9.2], [0.8, 6.0], [6.6, 8.6],
    [15.2, 6.8, "pine"], [11.0, 11.0], [4.2, 10.6, "pine"], [0.6, 13.6, "pine"], [15.4, 13.0, "pine"], [7.7, 13.8],
  ];
  const bushes = [ [0.6, 4.8], [0.6, 8.6], [7.9, 8.6], [10.2, 9.0], [1.2, 12.2], [8.0, 5.4], [13.0, 12.4] ];
  const flowerbeds = [ [1.0, 10.4], [8.9, 12.4], [3.4, 13.6], [13.6, 12.0] ];
  const ponds = [
    { gx: 2.4, gy: 14.6, r: 1.4, fountain: true },
    { gx: 9.6, gy: 13.8, r: 1.2, fountain: false },
  ];
  const lamps = [ [3.0, 11.7], [7.5, 11.7], [11.5, 11.7], [0.5, 11.7], [14.0, 11.7] ];
  const benches = [ [4.0, 12.0], [8.6, 12.0], [12.0, 12.0] ];
  const umbrellas = [ [1.1, 7.7, "#8bd66b"], [1.9, 7.7, "#7fd0ff"], [3.2, 8.5, "#5ad6f0"], [4.1, 8.5, "#ff9f6b"] ];

  function drawPond(p) {
    const c = isoToScreen(p.gx, p.gy);
    const R = p.r * TILE_W * 0.5;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(1, 0.5);
    // water
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = "#2f6f9e"; ctx.fill();
    ctx.beginPath(); ctx.arc(-R * 0.3, -R * 0.3, R * 0.64, 0, Math.PI * 2); ctx.fillStyle = "#4f93c4"; ctx.fill();
    // ripples
    ctx.strokeStyle = "rgba(220,240,255,0.5)"; ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      const t = ((nowMs * 0.00018 + k / 3) % 1);
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.beginPath(); ctx.arc(0, 0, t * R * 0.9, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // lily pads
    ctx.fillStyle = "#357a45";
    for (const o of [[-0.5, 0.3], [0.55, -0.2], [0.1, 0.55]]) {
      ctx.beginPath(); ctx.ellipse(o[0] * R, o[1] * R, 5, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    // duck
    const dx = Math.sin(nowMs * 0.0006) * R * 0.4;
    ctx.fillStyle = "#eef1f6";
    ctx.beginPath(); ctx.ellipse(dx, R * 0.2, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e8b24a";
    ctx.beginPath(); ctx.arc(dx + 3.5, R * 0.2 - 1.5, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // fountain (upright, screen space)
    if (p.fountain) {
      ctx.save();
      ctx.strokeStyle = "rgba(180,225,255,0.75)"; ctx.lineWidth = 1.4;
      for (let a = -2; a <= 2; a++) {
        const sway = Math.sin(nowMs * 0.006 + a) * 2;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y - 2);
        ctx.quadraticCurveTo(c.x + a * 3, c.y - 20, c.x + a * 6 + sway, c.y - 4);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(200,235,255,0.9)"; ctx.shadowColor = "#bfe6ff"; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(c.x, c.y - 22, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawPonds() { for (const p of ponds) drawPond(p); }

  function drawTree(gx, gy, type = "round") {
    const b = isoToScreen(gx, gy);
    if (type === "pine") {
      ctx.fillStyle = "#5a3f2b";
      ctx.fillRect(b.x - 1.6, b.y - 12, 3.2, 12);
      const tri = (cy, w, col) => { poly([{ x: b.x, y: b.y - cy - 13 }, { x: b.x + w, y: b.y - cy + 2 }, { x: b.x - w, y: b.y - cy + 2 }], col); };
      tri(6, 10, "#1f4d2a"); tri(15, 8, "#256034"); tri(24, 6, "#2c6f3c");
      return;
    }
    // trunk
    ctx.fillStyle = "#5a3f2b";
    ctx.fillRect(b.x - 2, b.y - 16, 4, 16);
    const blob = (dx, dy, r, col) => {
      ctx.beginPath(); ctx.arc(b.x + dx, b.y - 22 + dy, r, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill();
    };
    blob(0, 6, 12, "#20502c");
    blob(-6, 0, 9, "#286237");
    blob(6, 1, 9, "#2c6b3c");
    blob(0, -5, 10, "#347a45");
  }

  function drawBush(gx, gy) {
    const b = isoToScreen(gx, gy);
    const blob = (dx, r, col) => { ctx.beginPath(); ctx.arc(b.x + dx, b.y - 3, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); };
    blob(-4, 5, "#245a30"); blob(4, 5, "#245a30"); blob(0, 6, "#2c6d3c");
  }

  function drawFlowerbed(gx, gy) {
    const b = isoToScreen(gx, gy);
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1, 0.5);
    ctx.fillStyle = "#4a3526"; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    const cols = ["#e57373", "#f6c453", "#7fd0ff", "#e57fd0", "#f2f4f8"];
    for (let i = 0; i < 7; i++) {
      const a = i * 1.7, rr = 5;
      ctx.fillStyle = cols[i % cols.length];
      ctx.beginPath();
      ctx.arc(b.x + Math.cos(a) * rr, b.y - 2 + Math.sin(a) * rr * 0.5, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLamp(gx, gy) {
    const b = isoToScreen(gx, gy);
    // light pool on ground
    const grd = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, 34);
    grd.addColorStop(0, "rgba(255,224,150,0.28)");
    grd.addColorStop(1, "rgba(255,224,150,0)");
    ctx.fillStyle = grd;
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1, 0.5);
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // post
    ctx.strokeStyle = "#39415a"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y - 34); ctx.lineTo(b.x + 7, b.y - 36); ctx.stroke();
    // glowing head
    ctx.save();
    ctx.shadowColor = "#ffe08a"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#ffe6a0";
    ctx.beginPath(); ctx.arc(b.x + 8, b.y - 35, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawUmbrella(gx, gy, col) {
    const s = isoToScreen(gx, gy);
    // table
    ctx.fillStyle = "#6b7488";
    ctx.save(); ctx.translate(s.x, s.y - 2); ctx.scale(1, 0.5);
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // little chairs (dots)
    ctx.fillStyle = "#575e70";
    for (const dx of [-7, 7]) { ctx.beginPath(); ctx.arc(s.x + dx, s.y - 1, 1.8, 0, Math.PI * 2); ctx.fill(); }
    // pole
    ctx.strokeStyle = "#cfd3dc"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(s.x, s.y - 2); ctx.lineTo(s.x, s.y - 26); ctx.stroke();
    // canopy (4 alternating panels)
    const cy = s.y - 26, cw = 15, ch = 7, apex = { x: s.x, y: cy - 5 };
    const T = { x: s.x, y: cy - ch }, R = { x: s.x + cw, y: cy }, B = { x: s.x, y: cy + ch }, L = { x: s.x - cw, y: cy };
    const panels = [[T, R], [R, B], [B, L], [L, T]];
    panels.forEach((p, i) => poly([apex, p[0], p[1]], (i % 2 === 0) ? col : "#f2f4f8"));
  }

  function drawBench(gx, gy) {
    const b = isoToScreen(gx, gy);
    ctx.fillStyle = "#5b6273";
    ctx.fillRect(b.x - 9, b.y - 6, 18, 4);
    ctx.fillStyle = "#474d5c";
    ctx.fillRect(b.x - 9, b.y - 2, 18, 2);
  }

  // ---- Cars on the cross street ----
  const carCols = ["#d94f4f", "#4f79d9", "#e0b24f", "#5fb56f", "#d0d5df", "#9a5fd0"];
  const cars = [];
  (function seedCars() {
    for (let i = 0; i < 6; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      cars.push({
        lane: dir > 0 ? ROADV.gx - 0.15 : ROADV.gx + 0.15,
        gy: rand(-1, 12), dir, spd: rand(0.9, 1.5) / 1000,
        color: carCols[(Math.random() * carCols.length) | 0],
        len: i === 5 ? 1.3 : 0.62,   // one longer bus
      });
    }
  })();

  function updateCars(dt) {
    for (const c of cars) {
      c.gy += c.dir * c.spd * dt;
      if (c.dir > 0 && c.gy > 12.8) c.gy = -1.4;
      if (c.dir < 0 && c.gy < -1.4) c.gy = 12.8;
    }
  }

  function drawCar(c) {
    // headlight pool in the travel direction
    const hy = c.gy + c.dir * (c.len / 2 + 0.5);
    const hp = isoToScreen(c.lane, hy);
    const grd = ctx.createRadialGradient(hp.x, hp.y, 1, hp.x, hp.y, 26);
    grd.addColorStop(0, "rgba(255,240,190,0.35)");
    grd.addColorStop(1, "rgba(255,240,190,0)");
    ctx.save(); ctx.translate(hp.x, hp.y); ctx.scale(1, 0.5);
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    drawVehicle({ gx: c.lane, gy: c.gy, fx: 0.30, fy: c.len, hgt: c.len > 1 ? 16 : 11, body: c.color });

    // tail light
    const ty = c.gy - c.dir * c.len / 2;
    const tp = isoToScreen(c.lane, ty);
    ctx.save();
    ctx.fillStyle = "#ff5a5a"; ctx.shadowColor = "#ff5a5a"; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(tp.x, tp.y - 5, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---- People (animated pedestrians) ----
  const skinTones = ["#e6b98f", "#c98d63", "#8d5a3b", "#f0cba6"];
  const shirtCols = ["#e05a5a", "#4f8de0", "#e0a84f", "#5fbf7a", "#b06fd0", "#e0e0e0", "#57c4c4"];
  function rand(a, b) { return a + Math.random() * (b - a); }

  const people = [];
  (function seedPeople() {
    // Short back-and-forth routes on plazas / sidewalks (avoid footprints).
    const routes = [
      [5.2, 8, 5.2, 12], [10, 7, 10, 12], [6, 6.2, 12, 6.2],
      [1, 6.2, 4.5, 6.2], [5.4, 4, 5.4, 6.5], [7, 12.9, 12, 12.9],
      [2, 12.9, 4.5, 12.9], [10, 9, 10, 5], [11, 6.2, 15, 6.2],
      [12.5, 7.5, 12.5, 11],
    ];
    for (let i = 0; i < 22; i++) {
      const r = routes[i % routes.length];
      people.push({
        ax: r[0], ay: r[1], bx: r[2], by: r[3],
        t: Math.random(), dir: Math.random() < 0.5 ? 1 : -1,
        spd: rand(0.15, 0.32) / 1000,
        shirt: shirtCols[(Math.random() * shirtCols.length) | 0],
        skin: skinTones[(Math.random() * skinTones.length) | 0],
        ph: Math.random() * Math.PI * 2,
      });
    }
  })();

  function updatePeople(dt) {
    for (const p of people) {
      p.t += p.dir * p.spd * dt;
      if (p.t > 1) { p.t = 1; p.dir = -1; }
      if (p.t < 0) { p.t = 0; p.dir = 1; }
    }
  }

  function personPos(p) {
    return { gx: p.ax + (p.bx - p.ax) * p.t, gy: p.ay + (p.by - p.ay) * p.t };
  }

  function drawPerson(p, tmsec) {
    const g = personPos(p);
    const s = isoToScreen(g.gx, g.gy);
    const bob = Math.abs(Math.sin(tmsecPhase(p, tmsec))) * 1.6;
    // shadow
    ctx.save(); ctx.translate(s.x, s.y); ctx.scale(1, 0.5);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // body
    ctx.fillStyle = p.shirt;
    ctx.beginPath();
    ctx.roundRect(s.x - 2.4, s.y - 11 - bob, 4.8, 9, 2);
    ctx.fill();
    // head
    ctx.fillStyle = p.skin;
    ctx.beginPath();
    ctx.arc(s.x, s.y - 13 - bob, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  function tmsecPhase(p, tmsec) { return p.ph + tmsec * 0.008; }

  // ---- Cyclists / scooter riders ----
  const riders = [];
  (function seedRiders() {
    const routes = [
      [0, 11.6, 15.5, 11.6, "bike"], [15.5, 11.6, 0, 11.6, "scooter"],
      [10.3, 12, 10.3, 4, "bike"], [3, 6.4, 12, 6.4, "scooter"],
    ];
    for (const r of routes) {
      riders.push({
        ax: r[0], ay: r[1], bx: r[2], by: r[3], kind: r[4],
        t: Math.random(), dir: 1, spd: rand(0.5, 0.8) / 1000,
        shirt: shirtCols[(Math.random() * shirtCols.length) | 0],
        skin: skinTones[(Math.random() * skinTones.length) | 0],
      });
    }
  })();

  function updateRiders(dt) {
    for (const r of riders) {
      r.t += r.dir * r.spd * dt;
      if (r.t > 1) { r.t = 1; r.dir = -1; }
      if (r.t < 0) { r.t = 0; r.dir = 1; }
    }
  }

  function drawRider(r) {
    const g = { gx: r.ax + (r.bx - r.ax) * r.t, gy: r.ay + (r.by - r.ay) * r.t };
    const s = isoToScreen(g.gx, g.gy);
    // shadow
    ctx.save(); ctx.translate(s.x, s.y); ctx.scale(1, 0.5);
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // wheels + frame
    ctx.strokeStyle = "#20242f"; ctx.lineWidth = 1.4;
    const wy = s.y - 3, spin = nowMs * 0.02;
    for (const dx of [-4, 4]) {
      ctx.beginPath(); ctx.arc(s.x + dx, wy, 3, 0, Math.PI * 2); ctx.stroke();
      // spoke to show spin
      ctx.beginPath();
      ctx.moveTo(s.x + dx, wy);
      ctx.lineTo(s.x + dx + Math.cos(spin) * 3, wy + Math.sin(spin) * 3);
      ctx.stroke();
    }
    ctx.strokeStyle = "#6b7690";
    ctx.beginPath(); ctx.moveTo(s.x - 4, wy); ctx.lineTo(s.x, wy - 4); ctx.lineTo(s.x + 4, wy); ctx.stroke();
    // rider
    ctx.fillStyle = r.shirt;
    ctx.beginPath(); ctx.roundRect(s.x - 2, s.y - 13, 4, 8, 2); ctx.fill();
    ctx.fillStyle = r.skin;
    ctx.beginPath(); ctx.arc(s.x, s.y - 14.5, 2.4, 0, Math.PI * 2); ctx.fill();
  }

  // ---- Dogs / pets ----
  const dogCols = ["#b9793f", "#8a5a34", "#d8c39a", "#4a4a4a"];
  const dogs = [];
  (function seedDogs() {
    const routes = [
      [13.6, 9.6, 15.0, 9.6], [11.2, 3.2, 11.2, 5.4], [6.4, 12.3, 9.4, 12.3],
      [2.5, 8.6, 4.4, 8.6],
    ];
    for (const r of routes) {
      dogs.push({
        ax: r[0], ay: r[1], bx: r[2], by: r[3],
        t: Math.random(), dir: 1, spd: rand(0.35, 0.6) / 1000,
        color: dogCols[(Math.random() * dogCols.length) | 0],
      });
    }
  })();

  function updateDogs(dt) {
    for (const d of dogs) {
      d.t += d.dir * d.spd * dt;
      if (d.t > 1) { d.t = 1; d.dir = -1; }
      if (d.t < 0) { d.t = 0; d.dir = 1; }
    }
  }

  function drawDog(d) {
    const g = { gx: d.ax + (d.bx - d.ax) * d.t, gy: d.ay + (d.by - d.ay) * d.t };
    const s = isoToScreen(g.gx, g.gy);
    const face = d.dir > 0 ? 1 : -1;
    // shadow
    ctx.save(); ctx.translate(s.x, s.y); ctx.scale(1, 0.5);
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // legs
    ctx.strokeStyle = shade(d.color, 0.7); ctx.lineWidth = 1.2;
    const trot = Math.sin(nowMs * 0.02) * 1.2;
    for (const dx of [-3, 3]) {
      ctx.beginPath(); ctx.moveTo(s.x + dx, s.y - 4); ctx.lineTo(s.x + dx + trot * face, s.y); ctx.stroke();
    }
    // body
    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.ellipse(s.x, s.y - 5, 4.2, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(s.x + 4 * face, s.y - 6.5, 2.1, 0, Math.PI * 2); ctx.fill();
    // ear + tail
    ctx.fillRect(s.x + 4 * face - 0.5, s.y - 9, 1.4, 2);
    ctx.strokeStyle = d.color; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(s.x - 4 * face, s.y - 6); ctx.lineTo(s.x - 6 * face, s.y - 8.5); ctx.stroke();
  }

  // ---- Floating emoji speech bubbles ----
  const bubbles = [
    [4.6, 7.4, "😊", 64],   // 😊 near the cafes
    [8.2, 6.6, "🍕", 78],  // 🍕 plaza dining
    [11.8, 5.2, "👥", 150], // 👥 crowd top-right
    [2.2, 5.6, "☕", 96],         // ☕ coffee, left cafes
    [12.6, 9.4, "💬", 60],  // 💬 chat, right shops
    [6.6, 9.2, "❤️", 40],   // ❤ plaza
  ];

  function drawBubble(gx, gy, emoji, lift) {
    const anchor = isoLift(gx, gy, lift);
    const bob = Math.sin(nowMs * 0.002 + gx) * 2.2;
    const cx = anchor.x, cy = anchor.y + bob;
    const w = 30, h = 26, r = 9;

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#f6f8fc";
    roundRect(cx - w / 2, cy - h, w, h, r);
    ctx.fill();
    // tail
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 2);
    ctx.lineTo(cx + 5, cy - 2);
    ctx.lineTo(cx, cy + 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.font = '15px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, cx, cy - h / 2 + 1);
  }

  function drawBubbles() {
    for (const b of bubbles) drawBubble(b[0], b[1], b[2], b[3]);
  }

  // ---- Unified depth-sorted scene ----
  function drawScene() {
    const items = [];
    for (const b of buildings) items.push({ z: b.gx + b.gy + b.w + b.h, draw: () => drawBuilding(b) });
    for (const t of trees)   items.push({ z: t[0] + t[1], draw: () => drawTree(t[0], t[1], t[2]) });
    for (const bs of bushes) items.push({ z: bs[0] + bs[1] - 0.03, draw: () => drawBush(bs[0], bs[1]) });
    for (const f of flowerbeds) items.push({ z: f[0] + f[1] - 0.04, draw: () => drawFlowerbed(f[0], f[1]) });
    for (const l of lamps)   items.push({ z: l[0] + l[1] - 0.01, draw: () => drawLamp(l[0], l[1]) });
    for (const bn of benches) items.push({ z: bn[0] + bn[1] - 0.02, draw: () => drawBench(bn[0], bn[1]) });
    for (const u of umbrellas) items.push({ z: u[0] + u[1], draw: () => drawUmbrella(u[0], u[1], u[2]) });
    for (const p of people)  { const g = personPos(p); items.push({ z: g.gx + g.gy + 0.05, draw: () => drawPerson(p, nowMs) }); }
    for (const c of cars)    items.push({ z: c.lane + c.gy + 0.3, draw: () => drawCar(c) });
    for (const r of riders)  { const g = { gx: r.ax+(r.bx-r.ax)*r.t, gy: r.ay+(r.by-r.ay)*r.t }; items.push({ z: g.gx + g.gy + 0.06, draw: () => drawRider(r) }); }
    for (const d of dogs)    { const g = { gx: d.ax+(d.bx-d.ax)*d.t, gy: d.ay+(d.by-d.ay)*d.t }; items.push({ z: g.gx + g.gy + 0.04, draw: () => drawDog(d) }); }
    items.push({
      z: TRAM.gx + TRAM.gy + 0.9,
      draw: () => drawVehicle({ gx: TRAM.gx, gy: TRAM.gy, fx: 2.6, fy: 0.7, hgt: 26, body: "#c9d2e0" }),
    });
    items.sort((a, b) => a.z - b.z);
    for (const it of items) it.draw();
  }

  let last = performance.now();
  let nowMs = last;
  function frame(now) {
    nowMs = now;
    const dt = Math.min(50, now - last); last = now;
    updateTram(dt);
    updateMono(dt);
    updatePeople(dt);
    updateCars(dt);
    updateRiders(dt);
    updateDogs(dt);
    updateDrone(dt);

    const W = window.innerWidth, H = window.innerHeight;
    // Screen-space backdrop
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a1024");
    g.addColorStop(1, "#141d3a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    drawStars();
    drawMoon();
    drawClouds();
    drawBirds();

    // World-space scene (auto-fitted)
    ctx.setTransform(DPR * VIEW.scale, 0, 0, DPR * VIEW.scale, DPR * VIEW.ox, DPR * VIEW.oy);
    drawGround();
    drawLots();
    drawRoads();
    drawGlowPools();
    drawPonds();
    drawShadows();
    drawRails();
    drawScene();
    drawMonorail();
    drawAllSigns();
    drawDrone();
    drawBubbles();

    // Screen-space overlay
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawVignette();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
